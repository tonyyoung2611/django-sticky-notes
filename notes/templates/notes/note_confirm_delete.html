
{% extends "base.html" %}

{% block title %}Delete Sticky Note{% endblock %}

{% block content %}
    <h2>Delete Sticky Note</h2>

    <p>
        Are you sure you want to delete "{{ note.title }}"?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete Note</button>
    </form>

    <a href="{% url 'note_detail' note.pk %}">
        Cancel
    </a>
{% endblock %}
